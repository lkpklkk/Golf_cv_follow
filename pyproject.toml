[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golf-course-cv-tracker"
version = "0.1.0"
description = "Desktop computer vision tracker for golf cart following experiments."
requires-python = ">=3.11"
dependencies = [
  "dearpygui",
  "gdown",
  "numpy",
  "opencv-contrib-python",
  "torch",
  "torchreid",
  "torchvision",
  "ultralytics",
]

[project.scripts]
golf_cv = "golf_cv_cli:main"
golf_cv_video_test = "video_test_runner:main"
golf_cv_generate_dataset = "action.generate_dataset:main"
golf_cv_annotate = "utils.annotate_intervals:main"
golf_cv_train_action = "action.train:main"

[tool.setuptools]
py-modules = [
  "app_gui",
  "camera_selector",
  "config",
  "golf_cv_cli",
  "main",
  "video_test_runner",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["action*", "control*", "gesture*", "pipeline*", "reid*", "tracker*", "ui*", "utils*"]
